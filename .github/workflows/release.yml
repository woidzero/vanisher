name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Create venv & install dependencies
        run: |
          uv venv
          uv pip install -e .[dev,yaml,toml]

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Type check (ty)
        run: uv run ty check src/vanisher

      - name: Lint (ruff)
        run: uv run ruff check src/vanisher

      - name: Run tests
        run: uv run pytest -v

      - name: Build package
        run: uv run hatch build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist/*

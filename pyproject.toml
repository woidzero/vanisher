[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wvanisher"
dynamic = ["version"]
description = "A flexible configuration management library for Python with dot notation support, environment variable overrides, and more."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = [
  "config",
  "configuration",
  "management",
  "control",
  "env",
  "options",
  "parameters",
  "json",
  "json-db",
  "database",
  "db",
]
authors = [{ name = "woidzero", email = "wwwoidzero@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Typing :: Typed",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["python-dotenv"]

[project.optional-dependencies]
yaml = ["PyYAML"]
toml = ["toml"]
dev = ["ty", "ruff", "pytest", "coverage"]

[project.urls]
Documentation = "https://github.com/woidzero/vanisher#readme"
Issues = "https://github.com/woidzero/vanisher/issues"
Source = "https://github.com/woidzero/vanisher"

[tool.hatch.version]
path = "src/vanisher/__about__.py"

[tool.coverage.run]
source_pkgs = ["vanisher", "tests"]
branch = true
parallel = true
omit = ["src/vanisher/__about__.py"]

[tool.coverage.paths]
vanisher = ["src/vanisher", "*/vanisher/src/vanisher"]
tests = ["tests", "*/vanisher/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "def __repr__",
]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
ignore = ["FBT001", "FBT002"]

[tool.hatch.build.targets.wheel]
packages = ["src/vanisher"]
